<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | USA Welcome Week</title>
<meta name="description" content="Photos from USA Welcome Week events.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css?v=7">
</head>
<body>
<header class="site-head" id="site-head"></header>

<main>
  <div class="page-head">
    <div class="wrap">
      <span class="label"><b>/</b> Gallery</span>
      <h1>Photos from our events.</h1>
      <p><span id="shown-count"></span> Tap any photo to see it full size.</p>
    </div>
  </div>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="grid-foot"><button class="btn btn-line" id="more" type="button">Load more photos</button></div>
  </div>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-bar">
    <span class="label" id="lb-count"></span>
    <button class="lb-btn" id="lb-close" type="button" aria-label="Close">&#10005;</button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
    <button class="lb-btn lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous photo">&larr;</button>
    <button class="lb-btn lb-nav lb-next" id="lb-next" type="button" aria-label="Next photo">&rarr;</button>
  </div>
</div>

<footer class="site-foot" id="site-foot"></footer>

<script src="assets/site.js?v=7"></script>
<script src="assets/photos.js?v=7"></script>
<script>
(function () {
  var list = window.PHOTOS || [];
  var BATCH = 60;
  var grid = document.getElementById("grid"), more = document.getElementById("more");
  var rendered = 0, cols = [], heights = [];
  document.getElementById("shown-count").textContent = list.length.toLocaleString("en-US") + " photos.";

  function colCount() {
    var w = grid.clientWidth;
    return w < 520 ? 2 : w < 860 ? 3 : w < 1150 ? 4 : 5;
  }
  function resetCols() {
    var n = colCount();
    grid.innerHTML = ""; cols = []; heights = [];
    for (var i = 0; i < n; i++) {
      var c = document.createElement("div"); c.className = "grid-col";
      grid.appendChild(c); cols.push(c); heights.push(0);
    }
  }
  function add(from, to) {
    for (var i = from; i < to; i++) {
      var p = list[i], k = 0;
      for (var j = 1; j < heights.length; j++) if (heights[j] < heights[k]) k = j;
      var b = document.createElement("button");
      b.type = "button"; b.className = "ph"; b.dataset.i = i;
      b.style.aspectRatio = p[1] + " / " + p[2];
      b.setAttribute("aria-label", "Open photo " + (i + 1));
      var im = new Image();
      im.loading = "lazy"; im.decoding = "async"; im.alt = "";
      im.width = p[1]; im.height = p[2];
      im.onload = function () { this.classList.add("in"); };
      im.src = UWW.thumb(p[0]);
      if (im.complete) im.classList.add("in");
      b.appendChild(im);
      cols[k].appendChild(b);
      heights[k] += p[2] / p[1];
    }
  }
  function renderMore() {
    var to = Math.min(list.length, rendered + BATCH);
    add(rendered, to); rendered = to;
    more.hidden = rendered >= list.length;
  }
  more.addEventListener("click", renderMore);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (en) { if (en[0].isIntersecting && rendered < list.length) renderMore(); }, { rootMargin: "900px" }).observe(more);
  }
  var lastN = 0, rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var n = colCount();
      if (n !== lastN) { lastN = n; var keep = rendered; resetCols(); rendered = 0; add(0, keep); rendered = keep; }
    }, 150);
  });

  // ----- lightbox -----
  var lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img"), lbCount = document.getElementById("lb-count");
  var cur = -1, opener = null;
  function show(i) {
    cur = (i + list.length) % list.length;
    var p = list[cur];
    lbImg.src = UWW.thumb(p[0]);          // instant, then swap to the full size
    var full = new Image(), want = cur;
    full.onload = function () { if (cur === want) lbImg.src = full.src; };
    full.src = UWW.full(p[0]);
    lbImg.alt = "Photo " + (cur + 1);
    lbCount.textContent = (cur + 1).toLocaleString("en-US") + " / " + list.length.toLocaleString("en-US");
    var nx = list[(cur + 1) % list.length]; new Image().src = UWW.full(nx[0]);
  }
  function open(i, el) { opener = el; lb.hidden = false; document.body.style.overflow = "hidden"; show(i); document.getElementById("lb-close").focus(); }
  function close() { lb.hidden = true; document.body.style.overflow = ""; if (opener) opener.focus(); }
  grid.addEventListener("click", function (e) { var b = e.target.closest(".ph"); if (b) open(+b.dataset.i, b); });
  document.getElementById("lb-close").addEventListener("click", close);
  document.getElementById("lb-prev").addEventListener("click", function () { show(cur - 1); });
  document.getElementById("lb-next").addEventListener("click", function () { show(cur + 1); });
  document.getElementById("lb-stage").addEventListener("click", function (e) { if (e.target === this) close(); });
  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === "ArrowRight") show(cur + 1);
  });
  var sx = null;
  lb.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });

  lastN = colCount(); resetCols(); renderMore();
})();
</script>
</body>
</html>
